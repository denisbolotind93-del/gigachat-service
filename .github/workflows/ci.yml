name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - env:
          APP_ENV: "test"
          GIGACHAT_CREDENTIALS: "test_token"
        run: pytest -v --cov=api --cov=services --cov=llm --cov=config --cov-report=term-missing
